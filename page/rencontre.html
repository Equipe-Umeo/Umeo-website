<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umeo - Recontrons-nous</title>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <script defer src="https://unpkg.com/swup@4"></script>
    <script defer src="https://unpkg.com/@swup/slide-theme@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script defer src="/scripts.js"></script>
    <meta name="view-transition" content="same-origin" />
    <meta name="description" content="Page de contact : rencontrez-nous selon la modalité que vous voulez">
    <meta name="keywords"
        content="Umeo, consulting, conseil, pharma, pharmacie, expert, expertise, pharmaceutique, services, métiers, rencontre, rendea-vous, rdv, meeting">
</head>
<div id="mouse"></div>

<body>
    <header></header>
    <main id="swup" class="transition-fade">
        <section class="relative w__full">
            <div class="contained mt__50 w__full flex justify__center">
                <h1 class="w__full max__w__600px">Un projet à
                    <span class="belissio text__center block" style="transform: translateX(10%);">nous</span>
                    <span class="ligh__green__text text__right block">confier ?</span>
                </h1>
            </div>
        </section>
        <section class="relative p__y__100 mb__-100 flex justify__center items__center mobile__full">
            <div
                class="contained grey__bg semi__rounded p__x__40 pb__50 max__w__800px mb__50 mobile__full mobile__no__padding">
                <h2 class="medium__title dark__green__text">Nous serons heureux de vous rencontrer</h2>
                <form class="p__20 flex flex__column items__center" name="rencontre__form" id="rencontre__form" netlify
                    data-netlify-recaptcha="true" action="/page/success" data-netlify="true">
                    <div class="flex items__center w__full mobile__col justify__between">
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Nom </span><input required type="text" name="nom" />
                                </div>
                            </label>
                        </div>
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Prénom </span>
                                    <input required type="text" name="prenom" />
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="flex items__center w__full mobile__col justify__between">
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Société </span><input type="text" name="societe" />
                                </div>
                            </label>
                        </div>
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Fonction </span><input type="text" name="fonction" />
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="flex items__center w__full mobile__col justify__between">
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Email </span><input required type="email" name="email" />
                                </div>
                            </label>
                        </div>
                        <div class="w__half mobile__w__full">
                            <label>
                                <div class="flex">
                                    <span> Téléphone </span><input type="text" name="tel" />
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="flex items__center w__full mobile__col justify__between">
                        <div class="w__full">
                            <label>
                                <div class="flex"><span> Joindre un document </span><input type="file" multiple
                                        class="inputfile" name="docs" />
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="flex items__center w__full">
                        <div class="w__full">
                            <label>
                                <div class="flex flex__column">
                                    <span> Votre message </span>
                                    <textarea required name="msg"></textarea>
                                </div>
                            </label>
                        </div>
                    </div>
                    <div data-netlify-recaptcha="true"></div>
                    <button class="button dark__green__bg white__text mt__20" type="submit">Envoyer</button>
                </form>
            </div>
            <img id="contact__img__blob" class="w__400px disappear__mobile" src="/img/blob2.svg" alt="">
            <img id="contact__img" class="disappear__mobile" src="/img/img_rencontre_form.png" alt="">
        </section>
        <!-- Début de widget en ligne Calendly -->
        <div class="calendly-inline-widget mb__50"
            data-url="https://calendly.com/contact-umeo?hide_landing_page_details=1&background_color=105b63&text_color=ffffff&primary_color=ffbb33"
            style="min-width:320px;height:700px;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        <!-- Fin de widget en ligne Calendly -->
    </main>
    <footer></footer>
</body>

</html>
